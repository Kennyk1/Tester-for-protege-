<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Signup - Protege AI</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Nunito:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg:#05050F;
    --accent:#7C5CFC;
    --accent2:#C084FC;
    --white:#fff;
    --muted:#8A85A8;
    --card:#0F0F22;
    --border: rgba(124,92,252,0.2);
  }
  html,body{
    min-height:100vh;
    background:#080814;
    font-family:'Nunito',sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:16px;
  }
  .phone{
    width:100%;
    max-width:420px;
    height:100vh;
    background:var(--bg);
    border-radius:40px;
    border:1.5px solid rgba(255,255,255,0.07);
    box-shadow:
      0 0 0 9px #06060f,
      0 0 0 11px rgba(255,255,255,0.035),
      0 50px 120px rgba(0,0,0,0.85),
      0 0 60px rgba(124,92,252,0.08) inset;
    display:flex;
    flex-direction:column;
    overflow:hidden;
    position:relative;
  }
  .top-bar{
    display:flex;
    align-items:center;
    gap:16px;
    padding:20px 24px;
    color:white;
    font-weight:800;
    font-size:18px;
    background:rgba(0,0,0,0.1);
    position:sticky;
    top:0;
    z-index:10;
  }
  .back-btn{
    cursor:pointer;
    font-size:24px;
    font-weight:900;
    color:white;
    transition:0.2s;
  }
  .back-btn:hover{opacity:0.8;}
  .screen{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:24px 24px 36px;
    overflow-y:auto;
    scroll-behavior:smooth;
    position:relative;
  }
  .blob1, .blob2{position:absolute; border-radius:50%; pointer-events:none; animation: pulse 5s ease-in-out infinite;}
  .blob1{width:300px;height:300px; background:radial-gradient(circle, rgba(124,92,252,0.18) 0%, transparent 65%); top:-60px; left:50%; transform:translateX(-50%);}
  .blob2{width:220px;height:220px; background:radial-gradient(circle, rgba(56,189,248,0.1) 0%, transparent 65%); bottom:100px; right:-60px; animation-duration:6s; animation-direction:reverse;}
  @keyframes pulse{0%,100%{transform:translateX(-50%) scale(1);opacity:0.7;}50%{transform:translateX(-50%) scale(1.1);opacity:1;}}
  .hero{width:100%; height:220px; border-radius:28px; background:var(--card); border:1px solid var(--border); display:flex; align-items:center; justify-content:center; margin-top:24px; margin-bottom:32px;}
  .hero span{font-size:48px;}
  .text-block{width:100%; display:flex; flex-direction:column; align-items:center; text-align:center; gap:8px;}
  .app-label{font-size:12px; font-weight:700; letter-spacing:0.2em; text-transform:uppercase; color:var(--accent);}
  .app-title{font-family:'Syne',sans-serif; font-size:32px; font-weight:800; color:white;}
  .app-sub{font-size:14px; color:var(--muted); line-height:1.5; max-width:280px;}
  .input-group{display:flex; align-items:center; background:var(--card); border-radius:16px; padding:14px 16px; margin-bottom:16px; gap:8px; width:100%;}
  select,input{background:transparent; border:none; outline:none; color:white; font-size:16px;}
  select{min-width:100px;} input{flex:1;}
  .btn{width:100%; padding:16px; border:none; border-radius:16px; cursor:pointer; font-family:'Syne',sans-serif; font-size:18px; font-weight:800; background:linear-gradient(135deg,var(--accent),var(--accent2)); color:white; margin-top:12px; transition:0.2s;}
  .btn:active{transform:scale(0.97);}
</style>
</head>
<body>

<div class="phone">

  <div class="top-bar">
    <div class="back-btn" onclick="goBack()">←</div>
    <span>Sign Up</span>
  </div>

  <div class="screen">
    <div class="blob1"></div>
    <div class="blob2"></div>

    <div class="hero"><span>🎙️</span></div>

    <div class="text-block">
      <span class="app-label">Protege AI</span>
      <h1 class="app-title">Create Account</h1>
      <p class="app-sub">Enter your phone and referral code to continue</p>
    </div>

    <div class="input-group">
      <input type="text" placeholder="Full Name" id="name"/>
    </div>

    <div class="input-group">
      <select id="countryCode">
        <option value="+1">🇺🇸 +1</option>
        <option value="+44">🇬🇧 +44</option>
        <option value="+234">🇳🇬 +234</option>
        <option value="+91">🇮🇳 +91</option>
        <option value="+61">🇦🇺 +61</option>
        <option value="+81">🇯🇵 +81</option>
      </select>
      <input type="tel" placeholder="Phone number" id="phone" />
    </div>

    <div class="input-group">
      <input type="text" placeholder="Referral code (optional)" id="referral"/>
    </div>

    <button class="btn" onclick="submitSignup()">Sign Up</button>
  </div>

</div>

<script>
function goBack(){ window.history.back(); }

function getDeviceId(){
  return localStorage.getItem("device_id") || crypto.randomUUID();
}

async function submitSignup(){
  const name = document.getElementById("name").value.trim();
  const phone = document.getElementById("phone").value.trim();
  const referral = document.getElementById("referral").value.trim();
  const country = document.getElementById("countryCode").value;

  if(!name){ alert("Enter your name"); return; }
  if(!phone){ alert("Enter your phone"); return; }

  const device_id = getDeviceId();
  localStorage.setItem("device_id", device_id);

  const res = await fetch("https://sample-api-1-ryj7.onrender.com/api/signup", {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({
      name: name,
      phone: country + phone,
      password: "123456",
      referral: referral,
      device_id: device_id
    })
  });

  const data = await res.json();

  if(data.success){
    localStorage.setItem("token", data.token);
    window.location.href = "dashboard.html";
  } else {
    alert(data.message);
  }
}
</script>

</body>
</html>
