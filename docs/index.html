<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Protege AI – Welcome</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Nunito:wght@300;400;600;700&display=swap" rel="stylesheet"/>

<style>
*{box-sizing:border-box;margin:0;padding:0}

:root{
  --bg:#070712;
  --accent:#7C5CFC;
  --accent2:#C084FC;
  --accent3:#38BDF8;
  --muted:#9CA3AF;
}

html,body{
  height:100%;
  display:flex;
  justify-content:center;
  align-items:center;
  background:radial-gradient(circle at 30% 20%,#0f0f2a, #05050d 60%);
  font-family:'Nunito',sans-serif;
  overflow:hidden;
}

/* Animated neon gradient background */
body::before{
  content:"";
  position:absolute;
  width:150%;
  height:150%;
  background:conic-gradient(from 0deg,#7C5CFC,#38BDF8,#C084FC,#7C5CFC);
  filter:blur(120px);
  opacity:.25;
  animation:rotate 18s linear infinite;
}

@keyframes rotate{
  to{transform:rotate(360deg)}
}

.container{
  position:relative;
  z-index:2;
  width:100%;
  max-width:420px;
  padding:28px;
  border-radius:28px;
  background:rgba(15,15,34,0.7);
  backdrop-filter:blur(18px);
  border:1px solid rgba(124,92,252,.25);
  box-shadow:0 20px 60px rgba(0,0,0,.6);
  text-align:center;
}

/* Hero circle */
.hero{
  height:190px;
  display:flex;
  align-items:center;
  justify-content:center;
  margin-bottom:22px;
}

.mic{
  width:78px;
  height:78px;
  border-radius:50%;
  background:linear-gradient(135deg,var(--accent),var(--accent3));
  box-shadow:0 0 45px rgba(124,92,252,.7);
  animation:pulse 2.8s infinite ease-in-out;
}

@keyframes pulse{
  0%,100%{transform:scale(1)}
  50%{transform:scale(1.08)}
}

.title{
  font-family:'Syne',sans-serif;
  font-size:30px;
  font-weight:800;
  background:linear-gradient(135deg,#fff,#c4b5fd,#38BDF8);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  margin-bottom:10px;
}

.sub{
  font-size:16px;
  color:var(--muted);
  margin-bottom:28px;
  line-height:1.4;
  padding: 0 12px;
  word-wrap: break-word;
}

/* Buttons */
.btn{
  width:100%;
  height:54px;
  border-radius:14px;
  border:none;
  font-weight:700;
  cursor:pointer;
  margin-bottom:12px;
  font-family:'Syne',sans-serif;
  font-size:15px;
}

.primary{
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  color:#fff;
  box-shadow:0 10px 30px rgba(124,92,252,.5);
}

.secondary{
  background:transparent;
  border:1.5px solid rgba(124,92,252,.35);
  color:#c7c3ff;
}
</style>
</head>

<body>

<div class="container">

  <div class="hero">
    <div class="mic"></div>
  </div>

  <h1 class="title">Protege AI</h1>
  <p class="sub">
    Calculate anything instantly with the power of artificial intelligence.
  </p>

  <button class="btn primary" id="btn_get_started">🚀 Get Started</button>
  <button class="btn secondary" id="btn_sign_in">Already have an account? Sign in</button>

</div>

<script>
/* Navigation */
document.getElementById("btn_get_started").onclick = () => location.href = "signup.html";
document.getElementById("btn_sign_in").onclick = () => location.href = "login.html";
</script>

</body>
</html>
